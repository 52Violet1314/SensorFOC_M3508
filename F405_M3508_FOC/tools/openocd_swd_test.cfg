# ============================================================================
# tools/openocd_swd_test.cfg —— 单独验证 SWD 链路(不走 VS Code, 直接看原始报错)
#
# 用法(VS Code 里那个 Cortex-Debug 配置报的错太"结果化", 用这个看现场):
#   1) 用 DAPLink / MCU-Link:
#        C:\msys64\mingw64\bin\openocd.exe -f tools/openocd_swd_test.cfg
#   2) 用 J-Link(如果探针是 J-Link):
#        C:\msys64\mingw64\bin\openocd.exe -f tools/openocd_swd_test.cfg -c "interface jlink"
#
# 期望看到的"连上了"的样子:
#     Info : CMSIS-DAP: Interface ready
#     Info : clock speed 1000 kHz
#     Info : SWD DPIDR 0x2ba01477            <-- 这一行才是真的连上芯片
#     Info : [stm32f4x.cpu] Cortex-M4 r0p1 processor detected
#     Info : Listening on port 50000 for gdb connections
#
# 如果卡在(或报)下面这种, 说明探针 OK、芯片没应答 —— 问题在线/供电/芯片:
#     Info : CMSIS-DAP: Interface ready
#     Error: Error connecting DP: cannot read IDR
# ============================================================================

# GDB 端口(与 launch.json 的 servertype=openocd 默认一致)
gdb_port 50000
tcl_port 50001
telnet_port 50002

# 适配器速度: 先用 1MHz; 如果读不到 IDR 可以降到 100kHz 再试
adapter speed 1000

# 复位方式: DAPLink 通常没有接 nRESET, 用"只发命令不复位"的方式更稳
reset_config srst_only srst_nogate

# 目标: STM32F405
source [find target/stm32f4x.cfg]

# 连上之后停在这里, 不自动跑(方便接 GDB / 手动 continue)
init
halt
